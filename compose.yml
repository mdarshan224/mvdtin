services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dtm
      MYSQL_USER: dtm
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-development}
      DB_URL: jdbc:mysql://mysql:3306/dtm
      DB_USERNAME: dtm
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      UPLOAD_DIR: /app/uploads
      ANALYTICS_RETENTION_DAYS: 90
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:?Set FAST2SMS_API_KEY}
      FAST2SMS_OTP_ID: ${FAST2SMS_OTP_ID:?Set FAST2SMS_OTP_ID}
      ADMIN_ALLOWED_PHONES: ${ADMIN_ALLOWED_PHONES:?Set ADMIN_ALLOWED_PHONES}
    volumes:
      - media_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api
    restart: unless-stopped
  analytics:
    profiles: [analytics]
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
volumes:
  mysql_data:
  media_data:
