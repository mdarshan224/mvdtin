name: DTM platform CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
        working-directory: backend
        env:
          DB_PASSWORD: ''
          JWT_SECRET: unused-test-profile-overrides-this
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: node --test tests/otp-runtime.mjs
      - run: node --experimental-strip-types --test tests/algorithms.test.ts
      - run: pnpm exec vite build --config frontend/vite.config.ts
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - run: python -m unittest discover -s python -v
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile
      - name: Create ephemeral CI environment
        run: |
          python - <<'PY'
          import secrets,base64
          values={'DB_PASSWORD':secrets.token_urlsafe(24),'MYSQL_ROOT_PASSWORD':secrets.token_urlsafe(32),'JWT_SECRET':base64.b64encode(secrets.token_bytes(48)).decode(),'ADMIN_EMAIL':'ci@example.test','ADMIN_PASSWORD':secrets.token_urlsafe(24),'WEB_PORT':'8081','APP_ENV':'development','FAST2SMS_API_KEY':'ci-placeholder','FAST2SMS_OTP_ID':'ci-placeholder','ADMIN_ALLOWED_PHONES':'6999999999'}
          with open('.env','w') as file:
              file.write('\n'.join(f'{key}={value}' for key,value in values.items()))
          PY
      - run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8081/api/v1/runtime > /dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          TEST_BASE_URL: http://localhost:8081
      - if: always()
        run: docker compose down
